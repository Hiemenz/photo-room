name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The export tests compare tags with the real exiftool. rawpy and the
      # DNG Converter are still faked, so neither is needed on the runner.
      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Check exiftool
        run: exiftool -ver

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest
