name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The suite fakes rawpy, exiftool and the DNG Converter, so none of
      # those need to be present on the runner.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest
