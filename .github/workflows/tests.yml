name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The export tests compare tags with the real exiftool. rawpy and the
      # DNG Converter are still faked, so neither is needed on the runner.
      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Check exiftool
        run: exiftool -ver

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      # The tests that use the real exiftool (develop-settings round trip and
      # metadata preservation on export), on their own so a failure is obvious.
      - name: Run real-exiftool tests
        run: uv run pytest -m exiftool

  # Real-browser tests of the editor UI. Separate from the fast job above so
  # a slow or flaky browser never blocks the unit suite, and so it is the
  # one place that needs Chromium.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run UI tests
        run: uv run pytest -m ui

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/ui/artifacts/
          if-no-files-found: ignore

  # A clean install on a fresh runner, then the doctor, so "works on a new
  # machine" is tested and not assumed.
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Clean uv sync
        run: uv sync --frozen

      - name: photo-room doctor
        run: uv run photo-room doctor

      - name: photo-room runs from another directory
        run: cd "$RUNNER_TEMP" && uv run --project "$GITHUB_WORKSPACE" photo-room doctor

  # The wrong Python must fail loudly at `uv sync`, not install nothing.
  wrong-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: uv sync on Python 3.11 must fail with a clear message
        run: |
          set +e
          uv sync --python 3.11 > out.txt 2>&1
          code=$?
          cat out.txt
          [ "$code" -ne 0 ] || { echo "uv sync unexpectedly succeeded on 3.11"; exit 1; }
          grep -q "requires-python" out.txt || { echo "message does not mention requires-python"; exit 1; }
