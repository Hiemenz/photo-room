[pytest]
testpaths = tests
addopts = -q -m "not ui"
markers =
    no_converter: run as if Adobe DNG Converter is not installed
    ui: real-browser tests (Playwright + Chromium); run with `pytest -m ui`
    exiftool: uses the real exiftool binary (skipped when it is not installed); run with `pytest -m exiftool`
    realraw: needs a real raw sample downloaded from raw.pixls.us (PHOTO_ROOM_REAL_RAW=1)
