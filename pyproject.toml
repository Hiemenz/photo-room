[project]
name = "photo-room"
version = "0.1.0"
description = "CR2 to DNG converter with auto adjustments"
authors = [
    {name = "Kevin Hiemenz",email = "47609755+Hiemenz@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rawpy (>=0.27.1,<0.28.0) ; python_version >= \"3.12\" and python_version < \"4.0\"",
    "numpy (>=2.5.3,<3.0.0) ; python_version >= \"3.12\" and python_version < \"4.0\"",
    "pillow (>=12.3.0,<13.0.0) ; python_version >= \"3.12\" and python_version < \"4.0\"",
    "tqdm (>=4.70.1,<5.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "google-auth-oauthlib (>=1.4.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "duckdb (>=1.5.5,<2.0.0)",
    "opencv-python-headless (>=4.10,<5.0) ; python_version >= \"3.12\" and python_version < \"4.0\""
]

[project.optional-dependencies]
# Lens profiles (distortion, vignetting, TCA) from the lensfun database.
# Needs a C++ build or a wheel for your platform; without it the manual
# lens sliders and the generic chromatic-aberration fix still work.
lens = ["lensfunpy>=1.15"]


[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1,<10",
]

[tool.uv]
# Scripts, not an installable package.
package = false
