[project]
name = "photo-room"
version = "0.1.0"
description = "Local raw photo editor: import CR2 cards, edit like Lightroom, export with metadata intact"
authors = [
    {name = "Kevin Hiemenz",email = "47609755+Hiemenz@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rawpy (>=0.27.1,<0.28.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "google-auth-oauthlib (>=1.4.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "duckdb (>=1.5.5,<2.0.0)",
    "opencv-python-headless (>=4.10,<5.0)"
]

[project.optional-dependencies]
# Lens profiles (distortion, vignetting, TCA) from the lensfun database.
# Needs a C++ build or a wheel for your platform; without it the manual
# lens sliders and the generic chromatic-aberration fix still work.
lens = ["lensfunpy>=1.15"]
# Edit HEIC/HEIF files (Pillow reads them through pillow-heif).
heic = ["pillow-heif>=0.16"]
# On-device semantic search ("sunset over water") and find-similar with a CLIP-style
# ONNX model. Never required: without it search falls back to names/keywords/EXIF.
# The model itself is downloaded only by `python semantic.py download --yes`.
semantic = ["onnxruntime>=1.18", "tokenizers>=0.19"]
# Better face grouping in Library > People with a face-recognition ONNX model you
# supply. Never required: without it faces are grouped by simple texture features.
faces = ["onnxruntime>=1.18"]
# AVIF / JPEG XL export. Each is offered in the Export dialog only when installed.
avif = ["pillow-avif-plugin>=1.4"]
jxl = ["pillow-jxl-plugin>=1.3"]


[project.scripts]
# `uv run photo-room ~/Pictures/shoot` works from any directory.
photo-room = "photo_room_cli:main"
photo-room-doctor = "photo_room_cli:doctor_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "templates"]
exclude = ["tests", "scripts"]

[tool.hatch.build.targets.editable]
# Editable install = the repo root on sys.path, so every top-level module
# (and the templates beside editor.py) is found from any working directory.
dev-mode-dirs = ["."]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1,<10",
]

[tool.uv]
package = true
